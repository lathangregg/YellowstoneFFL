name: Update data and deploy

on:
  schedule:
    # 11:50 PM Central (05:50 UTC next day, i.e. CST) on Sunday, Monday and Thursday nights.
    - cron: '50 5 * * 1,2,5'
  workflow_dispatch: {}   # "Run workflow" button for a manual refresh
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/**'
      - 'tests/**'
      - 'config.json'
      - '.github/workflows/update.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch league data from Sleeper
        run: node scripts/fetch.mjs

      - name: Verify data and analytics
        run: node tests/verify.mjs

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/league.json
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Update league data"
            git push
          fi

      - uses: actions/configure-pages@v5
        if: ${{ vars.DEPLOY_PAGES != 'false' }}

      - uses: actions/upload-pages-artifact@v3
        if: ${{ vars.DEPLOY_PAGES != 'false' }}
        with:
          path: site

  deploy:
    # Skipped when the repository variable DEPLOY_PAGES is set to 'false' (e.g. when hosting on Cloudflare Pages instead).
    if: ${{ vars.DEPLOY_PAGES != 'false' }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
